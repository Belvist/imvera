# Voice lab overlay — Asterisk for Zoiper (ADR-001 lab only)
name: imvera-voice-lab

services:
  asterisk:
    build:
      context: ../..
      dockerfile: lab/asterisk/docker/Dockerfile
    container_name: imvera-asterisk-lab
    ports:
      - "5062:5060/udp"
      - "5062:5060/tcp"
      - "127.0.0.1:8088:8088"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./docker/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./docker/ari.conf:/etc/asterisk/ari.conf:ro
      - ./docker/http.conf:/etc/asterisk/http.conf:ro
      - ./docker/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./docker/extensions.conf:/etc/asterisk/extensions.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
