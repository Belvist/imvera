# MossVoice — DEV ENVIRONMENT (single-node compose).
#
# This is NOT the production topology. It runs one replica of everything on
# one machine, which is exactly what a dev environment should do. The
# product architecture (cells, voice worker pools, admission router,
# PgBouncer/PG-HA, K8s HPA) is defined in ENGINEERING_PLAN.md §16 — this
# file will be replaced by it, not grown into it.
#
#   voice     tts_server.py      9600  Silero TTS (женский голос, 48 кГц) + Whisper STT
#   answers   llama-server       9500  Qwen3-4B GGUF (llama.cpp, OpenAI-совместимый API)
#   telephony call_agent.py      9400  STT -> LLM -> TTS диалоговый движок
#   workflow  outbox_worker      —     outbox delivery + incident escalation
#   db/cache/storage             PostgreSQL + Redis + MinIO (data core)
#   --profile telegram: tg (8600), cloudflared tunnel, bot
#
# NOTE (P8, 2026-08-29): VoiceRuntime (voice_runtime/) is intentionally NOT a
# compose service. It drives FreeSWITCH over the ESL socket bound to the
# HOST loopback (127.0.0.1:8021) and shares /tmp/mossvoice file paths with
# the host FreeSWITCH for uuid_broadcast playback — a container cannot reach
# the host loopback, and opening ESL to the bridge would undo the P0 security
# fix. The runtime therefore runs on the host next to FreeSWITCH under
# launchd (com.mossvoice.runtime.plist + scripts/run_runtime.sh). The
# voice_runtime/ sources ARE copied into this image (see Dockerfile) so the
# whole tree ships in one artifact and host/container code stay in lockstep.
#
# Usage:
#   make up        собрать и поднять весь стек        (первый запуск скачивает
#   make update    обновить: пересобрать образы и перезапустить)
#   make ps/logs   статус / логи
#   make stop      остановить
#
# Models live in the "models" volume, NOT in the image: rebuilds are fast and
# `make update` never re-downloads weights. First boot downloads:
#   Silero TTS (torch hub) + Whisper-small (HF) в voice, Qwen3-4B GGUF в answers.
#
# Resource note: voice ~1.5 GB + answers ~3 GB + data core ~1 GB. Give
# Docker Desktop >= 12 GB RAM (Settings -> Resources -> Memory).

services:
  # ------------------------ Data core (Phase 2) ----------------------------
  # Authoritative state (PG), cache/leases (Redis), audio objects (MinIO).
  # Profile "db" starts them together for development/drills; production
  # services consume them via MOSS_PG_URL / MOSS_REDIS_URL / MOSS_S3_* env.
  db:
    image: postgres:16-alpine
    container_name: mossvoice-db
    environment:
      POSTGRES_DB: ${MOSS_PG_DB:-mossvoice}
      POSTGRES_USER: ${MOSS_PG_USER:-mossvoice}
      POSTGRES_PASSWORD: ${MOSS_PG_PASSWORD:-mossvoice_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOSS_PG_USER:-mossvoice} -d ${MOSS_PG_DB:-mossvoice}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: mossvoice-cache
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  storage:
    image: minio/minio:latest
    container_name: mossvoice-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MOSS_S3_ACCESS_KEY:-mossvoice_dev}
      MINIO_ROOT_PASSWORD: ${MOSS_S3_SECRET_KEY:-mossvoice_dev_secret}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  voice:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${MOSS_IMAGE:-mossvoice/backend:latest}
    container_name: mossvoice-voice
    # read.md rev-3: explicit exec-array form (no shell semantics), so the
    # command is identical across Compose versions. STT lives in the
    # telephony process (phone path) — voice is TTS only (--no-stt).
    command:
      - python
      - /app/runtime/scripts/tts_server.py
      - --host
      - 0.0.0.0
      - --port
      - "9600"
      - --threads
      - "4"
      - --model
      - ${MOSS_TTS_MODEL:-silero}
      - --allow-ref-dir
      - /app/refs
      - --allow-ref-dir
      - /app/telephony/refs
      - --no-stt
    environment:
      # Accuracy vs latency (2026-08-29): whisper-tiny mangled Russian phone
      # audio ("здравствуйте" -> gibberish) — the "неправильно слышит"
      # symptom. STT moved to the Qwen3-ASR host service (voice_runtime/
      # stt_host.py on Apple Silicon via MLX, Apache-2.0) which beats whisper
      # on real Russian phone audio; MOSS_STT_HOST is the host service reach
      # (host.docker.internal from the container). The whisper fallback stays
      # as a safety net when the host STT is unreachable.
      MOSS_STT_TRANSFORMERS_MODEL: ${MOSS_STT_MODEL:-openai/whisper-small}
      MOSS_STT_HOST: ${MOSS_STT_HOST:-http://host.docker.internal:9705}
      MOSS_SILERO_SPEAKER: ${MOSS_SILERO_SPEAKER:-kseniya}
    ports:
      - "127.0.0.1:9600:9600"
    volumes:
      - models:/data/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:9600/health', timeout=3)).get('ready') else 1)"]
      interval: 20s
      timeout: 10s
      retries: 60
      start_period: 900s
    restart: unless-stopped

  answers:
    # PRODUCT DECISION 2026-08-29: the local llama.cpp LLM is DISABLED —
    # the owner removed it from the dialogue path (replies were poor); the
    # cloud LLM (OpenRouter/DeepSeek via MOSS_LLM_PROVIDER=openai) is the
    # only LLM now. This service is kept in the `local-llm` profile so the
    # offline fallback can be re-enabled deliberately, but it is NOT part
    # of the default stack (saves ~2.5 GB RAM). Run with
    # `docker compose --profile local-llm up -d answers` to re-enable.
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: mossvoice-answers
    profiles: ["local-llm"]
    entrypoint: ["/bin/sh", "/app/llama_entrypoint.sh"]
    environment:
      MOSS_LLM_GGUF_URL: ${MOSS_LLM_GGUF_URL:-https://huggingface.co/unsloth/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf}
      # 2026-08-23: 4 threads BEAT 10 on this 4P+6E ARM VM — 10 thrashed the
      # E-cores (live: 9–15 tok/s gen, prefill 2.4–2.7 s) vs ~19.4 tok/s on 4.
      # Was applied ad-hoc once and LOST on the next `make update`; keep the
      # working value as the default here. Override freely via MOSS_LLM_THREADS.
      MOSS_LLM_THREADS: ${MOSS_LLM_THREADS:-4}
      MOSS_LLM_CTX: ${MOSS_LLM_CTX:-4096}
    volumes:
      - ../scripts/llama_entrypoint.sh:/app/llama_entrypoint.sh:ro
      - models:/data/models
    ports:
      - "127.0.0.1:9500:9500"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9500/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  telephony:
    image: ${MOSS_IMAGE:-mossvoice/backend:latest}
    container_name: mossvoice-telephony
    command: >
      python /app/telephony/call_agent.py
      --host 0.0.0.0 --port 9400
      --tts-host voice --tts-port 9600
      --outdir /tmp/mossvoice
      --ref /app/refs/ref_native_48k.wav
    environment:
      MOSS_LLM_URL: http://answers:9500
      MOSS_LLM_PROTOCOL: openai
      MOSS_LLM_BOOT_WAIT: "180"
      # CLOUD LLM EXPERIMENT (2026-08-25): switch the DIALOGUE to an
      # OpenAI-compatible cloud endpoint by setting, in .env:
      #   MOSS_LLM_PROVIDER=openai
      #   OPENAI_API_KEY=sk-or-...            (OpenRouter key)
      #   MOSS_LLM_OPENAI_MODEL=openai/gpt-4o-mini
      #   MOSS_LLM_BASE_URL=https://openrouter.ai/api/v1/chat/completions
      # Local llama.cpp (answers) stays up as the automatic fallback.
      MOSS_LLM_PROVIDER: ${MOSS_LLM_PROVIDER:-openai}
      MOSS_LLM_OPENAI_MODEL: ${MOSS_LLM_OPENAI_MODEL:-gpt-4o-mini}
      MOSS_LLM_BASE_URL: ${MOSS_LLM_BASE_URL:-https://api.openai.com/v1/chat/completions}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # STT runs IN this process (phone path) — Qwen3-ASR host service
      # preferred (better RU accuracy), whisper fallback otherwise.
      MOSS_STT_TRANSFORMERS_MODEL: ${MOSS_STT_MODEL:-openai/whisper-small}
      MOSS_STT_HOST: ${MOSS_STT_HOST:-http://host.docker.internal:9705}
      # Business processing (outbox/incidents) runs in the `workflow`
      # deployment, NOT in the realtime call process.
      MOSS_OUTBOX_INPROCESS: "0"
      # SCHEMA OWNERSHIP (read.md rev-3): DDL is the `migrate` job's; this
      # realtime process only verifies the schema is complete (read-only).
      MOSS_RUN_MIGRATIONS: "0"
      # ADMISSION CONTROL: hard cap on live calls (0 = unlimited, dev).
      # read.md rev-2 #15: unlimited is a collapse risk even on one node
      # (one TTS/STT/LLM) — production sets a FINITE value close to the
      # measured knee point. Dev default: 4 concurrent calls is a sane
      # single-node ceiling; override freely via .env.
      MOSS_MAX_CONCURRENT_CALLS: ${MOSS_MAX_CONCURRENT_CALLS:-4}
      MOSS_PG_URL: postgresql://${MOSS_PG_USER:-mossvoice}:${MOSS_PG_PASSWORD:-mossvoice_dev}@db:5432/${MOSS_PG_DB:-mossvoice}
      MOSS_REDIS_URL: redis://cache:6379/0
      MOSS_S3_ENDPOINT: http://storage:9000
      MOSS_S3_ACCESS_KEY: ${MOSS_S3_ACCESS_KEY:-mossvoice_dev}
      MOSS_S3_SECRET_KEY: ${MOSS_S3_SECRET_KEY:-mossvoice_dev_secret}
      MOSS_S3_BUCKET: ${MOSS_S3_BUCKET:-mossvoice-recordings}
      # PHONE-PATH "не слышит" FORENSICS (2026-08-25): keep a copy of every
      # turn that was blanked (no usable transcript) at
      #   <outdir>/blank_audio/<call_id>_<ts>.wav
      # so a live "Вера говорит я вас не слышу" can be dissected offline
      # (RMS/VAD/whisper) to tell a dead mic from a silent caller vs
      #   quiet/attenuated RTP. Off by default to avoid disk growth and the
      #   retention of user audio; enable per-deploy via
      #   MOSS_RETAIN_BLANK_AUDIO=1 (PII — pair with retention/cleanup).
      MOSS_RETAIN_BLANK_AUDIO: ${MOSS_RETAIN_BLANK_AUDIO:-0}
    volumes:
      # FreeSWITCH (host) and the agent (container) must see the SAME paths:
      # the Lua dialplan plays reply WAVs and uploads caller turns by path,
      # and both sides share /tmp/mossvoice one-to-one.
      - /tmp/mossvoice:/tmp/mossvoice
      # Conversation scenarios: edit on the host, `docker compose restart
      # telephony` picks them up — no image rebuild needed.
      - ../telephony/vera_scenarios.txt:/app/telephony/vera_scenarios.txt:ro
      - models:/data/models
    ports:
      - "127.0.0.1:9400:9400"
    # read.md rev-2 #13: truthful deployment — the container is healthy only
    # when /ready reports a working realtime pipeline (STT+TTS), so TG never
    # starts against a telephony that is alive but not usable.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:9400/ready', timeout=3)).get('ready') else 1)"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 300s
    depends_on:
      voice:
        condition: service_healthy
      # answers (local llama.cpp) is in the `local-llm` profile — NOT a
      # startup dependency (2026-08-29 product decision: cloud LLM only).
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Schema-migration JOB (read.md rev-3): DDL is owned by this one-shot
  # service, never by the realtime telephony process. It runs once (after the
  # DB is healthy) and exits; telephony is gated on its successful completion.
  migrate:
    image: ${MOSS_IMAGE:-mossvoice/backend:latest}
    container_name: mossvoice-migrate
    command: python /app/telephony/workers/migrate_main.py
    environment:
      MOSS_PG_URL: postgresql://${MOSS_PG_USER:-mossvoice}:${MOSS_PG_PASSWORD:-mossvoice_dev}@db:5432/${MOSS_PG_DB:-mossvoice}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Business worker deployment: outbox delivery + incident escalation.
  # Deliberately SEPARATE from the realtime call process (failure domain:
  # an outbox backlog must never steal CPU from live audio). Stateless,
  # lease-based — scale to N replicas safely.
  workflow:
    image: ${MOSS_IMAGE:-mossvoice/backend:latest}
    container_name: mossvoice-workflow
    command: python /app/telephony/workers/outbox_worker_main.py
    environment:
      MOSS_PG_URL: postgresql://${MOSS_PG_USER:-mossvoice}:${MOSS_PG_PASSWORD:-mossvoice_dev}@db:5432/${MOSS_PG_DB:-mossvoice}
      MOSS_WORKER_ID: workflow-1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Retention worker (read.md rev-3 G8): guaranteed TTL purge of expired user
  # data — PG rows + S3 objects + local WAV cache — leaving a durable audit
  # marker. SEPARATE failure domain from the realtime call process.
  retention:
    image: ${MOSS_IMAGE:-mossvoice/backend:latest}
    container_name: mossvoice-retention
    command: python /app/telephony/workers/retention_worker_main.py
    environment:
      MOSS_PG_URL: postgresql://${MOSS_PG_USER:-mossvoice}:${MOSS_PG_PASSWORD:-mossvoice_dev}@db:5432/${MOSS_PG_DB:-mossvoice}
      MOSS_S3_ENDPOINT: http://storage:9000
      MOSS_S3_ACCESS_KEY: ${MOSS_S3_ACCESS_KEY:-mossvoice_dev}
      MOSS_S3_SECRET_KEY: ${MOSS_S3_SECRET_KEY:-mossvoice_dev_secret}
      MOSS_S3_BUCKET: ${MOSS_S3_BUCKET:-mossvoice-recordings}
      MOSS_CALLS_OUTDIR: /tmp/mossvoice
      MOSS_RETENTION_INTERVAL_SECONDS: ${MOSS_RETENTION_INTERVAL_SECONDS:-3600}
    volumes:
      - /tmp/mossvoice:/tmp/mossvoice
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------- Telegram gateway (optional) -----------------------
  tg:
    profiles: ["telegram"]
    image: ${MOSS_IMAGE:-mossvoice/backend:latest}
    container_name: mossvoice-tg
    command: >
      python /app/telephony/tg/tg_server.py
      --host 0.0.0.0 --port 8600
      --agent http://telephony:9400
      --web-dir /app/telephony/tg/web
    environment:
      MOSSVOICE_BOT_TOKEN: ${MOSSVOICE_BOT_TOKEN:-}
    ports:
      # SECURITY: bind to loopback only. The public path is the cloudflared
      # tunnel (container -> container, no host port involved). With an
      # empty MOSSVOICE_BOT_TOKEN the initData HMAC check is disabled, and
      # a 0.0.0.0 binding would expose /ws and /metrics to the LAN.
      - "127.0.0.1:8600:8600"
    depends_on:
      # read.md rev-2 #13: wait for the REAL /ready gate, not just process
      # start — TG must not talk to a telephony whose STT/TTS are broken.
      telephony:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    profiles: ["telegram"]
    image: cloudflare/cloudflared:latest
    container_name: mossvoice-tunnel
    command: tunnel --no-autoupdate --url http://tg:8600
    depends_on:
      - tg
    restart: unless-stopped

  bot:
    profiles: ["telegram"]
    image: ${MOSS_IMAGE:-mossvoice/backend:latest}
    container_name: mossvoice-bot
    command: >
      sh -c "python /app/telephony/tg/bot.py --webapp-url $${WEBAPP_URL}"
    environment:
      MOSSVOICE_BOT_TOKEN: ${MOSSVOICE_BOT_TOKEN:-}
      WEBAPP_URL: ${WEBAPP_URL:-}
    depends_on:
      - cloudflared
    restart: unless-stopped

# ------------------------- Avtotesty (CI stage) ----------------------------
# The SAME production image runs the full unit-test suite; nothing is
# re-implemented "for tests". Daemon-level HTTP tests skip themselves when
# no daemon is running inside the container (offline-safe suite).
#   make test        (= docker compose run --rm tests)
#   make test-live   integration tests against a voice daemon in this compose
  tests:
    profiles: ["tests"]
    image: ${MOSS_IMAGE:-mossvoice/backend:latest}
    container_name: mossvoice-tests
    working_dir: /app/telephony
    command: sh /app/telephony/tests/run_in_container.sh
    environment:
      MOSS_RUNTIME_SCRIPTS: /app/runtime/scripts
      # empty => daemon-level tests skip themselves (offline suite);
      # "make test-live" sets it to http://voice:9600
      MOSSTEST_TTS: ${MOSSTEST_TTS:-}
      MOSSTEST_WAIT_DAEMON: ${MOSSTEST_WAIT_DAEMON:-}
      # UNIT tier (read.md rev-3): MOSS_PG_URL / MOSS_REDIS_URL are
      # deliberately UNSET, so DB/realtime-integration tests skip themselves.
      # This keeps `make test` a genuine offline unit suite even though the
      # image ships the psycopg/redis deps. Real data-core drills run in the
      # separate `tests-data` service (below), NOT here.
    depends_on: []

  # Integration-data tier (read.md rev-3): the SAME image, but pointed at the
  # real data core so Postgres/Redis-backed tests actually execute. `make
  # test-data`. Kept separate from `tests` so unit != integration, matching
  # the review's tier split (unit / integration-data / integration-models /
  # sip-e2e).
  tests-data:
    profiles: ["tests"]
    image: ${MOSS_IMAGE:-mossvoice/backend:latest}
    container_name: mossvoice-tests-data
    working_dir: /app/telephony
    command: sh /app/telephony/tests/run_in_container.sh
    environment:
      MOSS_RUNTIME_SCRIPTS: /app/runtime/scripts
      MOSSTEST_TTS: ${MOSSTEST_TTS:-}
      MOSSTEST_WAIT_DAEMON: ${MOSSTEST_WAIT_DAEMON:-}
      MOSS_PG_URL: postgresql://${MOSS_PG_USER:-mossvoice}:${MOSS_PG_PASSWORD:-mossvoice_dev}@db:5432/${MOSS_PG_DB:-mossvoice}
      MOSS_REDIS_URL: redis://cache:6379/0
      MOSS_S3_ENDPOINT: http://storage:9000
      MOSS_S3_ACCESS_KEY: ${MOSS_S3_ACCESS_KEY:-mossvoice_dev}
      MOSS_S3_SECRET_KEY: ${MOSS_S3_SECRET_KEY:-mossvoice_dev_secret}
      MOSS_S3_BUCKET: ${MOSS_S3_BUCKET:-mossvoice-recordings}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  models:
  calls:
  pgdata:
  redisdata:
  miniodata:
