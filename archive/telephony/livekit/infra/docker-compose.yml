# LiveKit self-hosted — ADR-012
# Linux: host networking for SIP/RTP. macOS: SIP gate may require Linux host.
# Redis: uses host localhost:6379 (imvera-cache or standalone redis). No bundled redis here.

services:
  livekit-server:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  livekit-sip:
    image: livekit/sip:latest
    network_mode: host
    environment:
      SIP_CONFIG_BODY: |
        api_key: 'devkey'
        api_secret: 'secret'
        ws_url: 'ws://localhost:7880'
        redis:
          address: 'localhost:6379'
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          level: debug
    depends_on:
      - livekit-server
    restart: unless-stopped
