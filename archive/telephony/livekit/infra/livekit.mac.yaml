# LiveKit Server — macOS Docker Desktop (published ports, NOT host network)
# IMVERA rtc participant + webhooks from host gateway.

port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false

redis:
  address: host.docker.internal:6379

keys:
  devkey: secret

logging:
  level: info

webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:9200/livekit/webhook

room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 20
