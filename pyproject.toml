[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imvera-voiseup"
version = "0.1.0"
description = "IMVERA voice + telephony stack (greenfield)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "psycopg[binary]>=3.2",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "onnxruntime>=1.19",
]
mlx = [
    "mlx>=0.22",
    "mlx-lm>=0.21",
    "mlx-audio",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
    "soundfile>=0.12",
]
gigaam-stt = [
    "gigaam @ git+https://github.com/salute-developers/GigaAM.git",
    "torch>=2.2",
    "torchaudio>=2.2",
    "omegaconf>=2.3",
    "certifi>=2024.0",
    "tqdm>=4.66",
]
lab-silero = [
    "torch>=2.2",
    "omegaconf>=2.3",
    "soundfile>=0.12",
    "numpy>=1.26",
]
livekit = [
    "livekit>=1.0",
    "livekit-api>=1.0",
]
sip-lab = [
    "pyVoIP==1.6.8",
    "audioop-lts>=0.2.1",
]

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.wheel]
packages = ["packages"]

[tool.hatch.build.targets.sdist]
include = ["packages", "services", "tests", "docs", "docker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "livekit_live: requires self-hosted LiveKit + SIP stack (Linux host networking)",
    "livekit_media_live: requires livekit-media-gate PASS on Linux host",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
