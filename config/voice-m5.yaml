profile_id: m5-mlx
description: Apple Silicon MLX local voice profile (engineering candidate)

ports:
  stt: 9101
  tts: 9102
  llm: 9103

models:
  asr:
    id: mlx-community/Qwen3-ASR-0.6B-8bit
    language: Russian
  llm:
    id: mlx-community/Qwen3-4B-4bit
    max_tokens_interpret: 512
    max_tokens_render: 120
    enable_thinking: false
  tts:
    # Engine: mlx_customvoice (preset/clone) | mlx_base_clone (workbench ref) | silero_lab (NC, lab only)
    engine: mlx_customvoice
    id: mlx-community/Qwen3-TTS-12Hz-0.6B-CustomVoice-8bit
    base_model_id: mlx-community/Qwen3-TTS-12Hz-0.6B-Base-bf16
    # Warm preset default — FLEURS zero-shot clone on CustomVoice often sounds uncanny/mocky.
    voice: serena
    lang_code: Russian
    streaming_interval: 0.16
    use_ref: false
    ref_id: bootstrap_serena_ru
    ref_audio: config/voice_refs/bootstrap_serena_ru.wav
    ref_text: "Добрый день! Расскажите, пожалуйста, принимали ли вы лекарства утром, как обычно?"
    generation:
      temperature: 0.65
      speed: 0.95
      top_p: 0.92
      top_k: 40
      repetition_penalty: 1.03
      instruct: >-
        Тёплый спокойный голос без иронии и насмешки. Говорите бережно и естественно,
        как заботливая знакомая пожилому человеку. Без театральности и карикатурной интонации.
    profiles:
      reference_clone:
        engine: mlx_base_clone
        use_ref: true
        notes: >-
          Use after IMVERA_Voice_Workbench clone QA (verified_transcript). Loads Base model,
          not CustomVoice — better zero-shot cloning per Qwen docs.
    silero_lab:
      # CC BY-NC-SA 4.0 — LOCAL LAB ONLY (ADR-002). Requires IMVERA_SILERO_LAB_ACK=1.
      model: v5_5_ru
      speaker: kseniya
      language: ru
      sample_rate: 24000
      license: CC-BY-NC-SA-4.0
      license_warning: Non-commercial — not for production or pilot
  vad:
    onnx: silero_vad

dialogue_timing:
  answer_wait_ms: 7000
  backchannel_extra_ms: 2000
  pause_wait_ms: 30000
  max_pause_wait_ms: 60000

limits:
  max_active_calls: 1
  queue_depth: 4
  stt_deadline_s: 12.0
  llm_deadline_s: 15.0
  tts_deadline_s: 20.0
  playback_buffer_ms: 200

audio:
  # STT/VAD branch — Silero + ASR expect 16 kHz; do not raise for SIP lab wideband.
  internal_sample_rate: 16000
  # SIP lab downlink: slin48 @ 48 kHz on chan_websocket inject (TTS ~24 kHz → upsample once).
  # PSTN prod trunks: set inject_format=ulaw via IMVERA_INJECT_FORMAT.
  inject_format: slin48
  capture_format: slin16
  output_sample_rate: 48000
  frame_ms: 20
  # Zoiper 5 Mac has no L16/48000 — lab wideband is G.722 @ 16 kHz (not slin48 on RTP leg).
  # Full 48 kHz: browser WS client (gateway /media/{call_id}) or slin48 SIP softphone.
  sip_codecs: g722,slin48,slin24,slin16
  # PyVoIP SIP e2e (scripts/voice_sip_e2e.py) — account 1002, G.711 only.
  sip_codecs_e2e: ulaw,alaw

sip:
  vera_extension: "7000"
  dev_account: "1001"
  context: imvera-local
  stasis_app: imvera
