name: CI

on:
  push:
    branches: [main, feature/voice-zoiper-m5]
  pull_request:
    branches: [main, feature/voice-zoiper-m5]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Contracts check
        run: make contracts-check

  legacy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff (repo-wide, mandatory since A.5.1)
        run: make lint

  lint-dialogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff (dialogue + runtime + PR touched)
        run: |
          make lint-dialogue
          make lint-touched

  dialogue-rich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,test]"
      - name: Phase 2 rich turn gate
        run: make test-dialogue-rich

  semantic-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,test]"
      - name: Semantic Kernel gate
        run: make test-semantic-kernel

  dialogue-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,test]"
      - name: Dialogue runtime integration gate
        run: make test-dialogue-runtime

  action-policy-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Frozen SHA guard needs full history for 61e17934… compare.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,test]"
      - name: ActionPolicy Shadow M1 gate
        run: make test-action-policy-shadow

  dialogue-corpus-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,test]"
      - name: Dialogue corpus gate (500 trajectories)
        run: make dialogue-corpus-gate

  policy-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Differential loads the pinned v8 policy at c0fa158b; a shallow
          # checkout cannot supply its historical tree/blob objects.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,test]"
      - name: Policy differential gate
        run: python3 tools/voice_lab/policy_diff_v8_v9.py

  test:
    runs-on: ubuntu-latest
    needs: contracts
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: imvera
          POSTGRES_PASSWORD: imvera_dev_change_me
          POSTGRES_DB: imvera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imvera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      IMVERA_PG_URL: postgresql://imvera:imvera_dev_change_me@localhost:5432/imvera
    steps:
      - uses: actions/checkout@v4
        with:
          # Shadow frozen-policy guard needs history for SHA 61e17934…
          fetch-depth: 0
          # xenc_v3 is a trained local encoder; a pointer is not model data.
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU inference runtime
        # The full suite exercises real neural-ranker code. Avoid downloading
        # CUDA libraries on the CPU-only runner and use the tested version.
        run: pip install "torch==2.14.1" --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -e ".[dev,test,semantic-nlp]"

      - name: Apply migrations
        run: make migrate
      - name: Phase 1 dialogue topic gate
        run: make test-dialogue-topic
      - name: Pytest (full runnable suite)
        run: make test
