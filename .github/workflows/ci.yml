name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: imvera
          POSTGRES_PASSWORD: imvera_dev_change_me
          POSTGRES_DB: imvera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imvera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      IMVERA_PG_URL: postgresql://imvera:imvera_dev_change_me@localhost:5432/imvera
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Apply migrations
        run: make migrate

      - name: Contracts check
        run: make contracts-check

      - name: Ruff
        run: make lint

      - name: Pytest
        run: make test
