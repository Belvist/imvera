name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Contracts check
        run: make contracts-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff (repo-wide)
        run: make lint
      - name: Ruff (Phase 1 dialogue touched files)
        run: >-
          python3 -m ruff check
          packages/dialogue_engine/topic_tracker.py
          packages/dialogue_engine/reducer.py
          packages/dialogue_engine/state.py
          packages/dialogue_engine/questions.py
          packages/dialogue_engine/invariants.py
          packages/dialogue_engine/scenario_runner.py
          tests/test_topic_tracker.py
          tests/test_topic_live_regression.py
          tools/voice_lab/dialogue_forensic.py

  dialogue-rich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Phase 2 rich turn gate
        run: make test-dialogue-rich

  test:
    runs-on: ubuntu-latest
    needs: contracts
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: imvera
          POSTGRES_PASSWORD: imvera_dev_change_me
          POSTGRES_DB: imvera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imvera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      IMVERA_PG_URL: postgresql://imvera:imvera_dev_change_me@localhost:5432/imvera
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,test]"
        run: make migrate
      - name: Phase 1 dialogue topic gate
        run: make test-dialogue-topic
      - name: Pytest (full suite)
        run: make test
