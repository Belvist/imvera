name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Contracts check
        run: make contracts-check

  legacy-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff (repo-wide legacy debt)
        run: make lint

  lint-dialogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff (dialogue + runtime + PR touched)
        run: |
          make lint-dialogue
          make lint-touched

  dialogue-rich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Phase 2 rich turn gate
        run: make test-dialogue-rich

  semantic-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Semantic Kernel gate
        run: make test-semantic-kernel

  dialogue-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,test]"
      - name: Dialogue runtime integration gate
        run: make test-dialogue-runtime

  test:
    runs-on: ubuntu-latest
    needs: contracts
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: imvera
          POSTGRES_PASSWORD: imvera_dev_change_me
          POSTGRES_DB: imvera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imvera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      IMVERA_PG_URL: postgresql://imvera:imvera_dev_change_me@localhost:5432/imvera
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,test]"

      - name: Apply migrations
        run: make migrate
      - name: Phase 1 dialogue topic gate
        run: make test-dialogue-topic
      - name: Pytest (full runnable suite)
        run: make test
