<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IMVERA — разговор с Верой</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    button { font-size: 1rem; padding: 0.6rem 1.2rem; margin: 0.25rem; }
    #status { margin: 1rem 0; padding: 0.75rem; background: #f4f4f4; border-radius: 6px; }
    #log { font-size: 0.85rem; white-space: pre-wrap; max-height: 12rem; overflow-y: auto; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Разговор с Верой</h1>
  <p>Микрофонный клиент IMVERA (ADR-008). Требуются настроенные STT и TTS endpoints.</p>
  <label>Семья (family_id): <input id="familyId" value="fam-demo" /></label><br/><br/>
  <button id="startBtn">Начать разговор</button>
  <button id="stopBtn" disabled>Завершить</button>
  <div id="status">Не подключено</div>
  <div id="log"></div>
  <script>
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    let ws, audioCtx, processor, stream, playbackCtx, nextPlayTime = 0;
    const SAMPLE_RATE = 16000;

    function log(msg) {
      logEl.textContent += msg + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className = isError ? 'error' : '';
    }

    async function playPcm(arrayBuffer) {
      if (!playbackCtx) playbackCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
      const int16 = new Int16Array(arrayBuffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
      const buf = playbackCtx.createBuffer(1, float32.length, SAMPLE_RATE);
      buf.copyToChannel(float32, 0);
      const src = playbackCtx.createBufferSource();
      src.buffer = buf;
      src.connect(playbackCtx.destination);
      const now = playbackCtx.currentTime;
      const start = Math.max(now, nextPlayTime);
      src.start(start);
      nextPlayTime = start + buf.duration;
    }

    startBtn.onclick = async () => {
      const familyId = document.getElementById('familyId').value.trim();
      if (!familyId) { setStatus('Укажите family_id', true); return; }
      const callId = 'mic-' + Math.random().toString(36).slice(2, 10);
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const url = `${proto}://${location.host}/ws/voice/${callId}?family_id=${encodeURIComponent(familyId)}&sample_rate=${SAMPLE_RATE}`;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 },
        });
      } catch (e) {
        setStatus('Микрофон недоступен: ' + e.message, true);
        return;
      }
      ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';
      ws.onopen = async () => {
        setStatus('Подключено. Говорите…');
        startBtn.disabled = true;
        stopBtn.disabled = false;
        ws.send(JSON.stringify({ type: 'media.ready', sample_rate: SAMPLE_RATE }));
        audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
        const source = audioCtx.createMediaStreamSource(stream);
        processor = audioCtx.createScriptProcessor(4096, 1, 1);
        processor.onaudioprocess = (e) => {
          if (ws.readyState !== WebSocket.OPEN) return;
          const input = e.inputBuffer.getChannelData(0);
          const pcm = new Int16Array(input.length);
          for (let i = 0; i < input.length; i++) {
            const s = Math.max(-1, Math.min(1, input[i]));
            pcm[i] = s < 0 ? s * 32768 : s * 32767;
          }
          ws.send(pcm.buffer);
        };
        source.connect(processor);
        processor.connect(audioCtx.destination);
      };
      ws.onmessage = async (ev) => {
        if (typeof ev.data === 'string') {
          const msg = JSON.parse(ev.data);
          log(msg.type + (msg.payload?.text ? ': ' + msg.payload.text : ''));
          if (msg.type === 'persistence.failed') setStatus('Ошибка сохранения', true);
        } else {
          await playPcm(ev.data);
        }
      };
      ws.onerror = () => setStatus('Ошибка WebSocket', true);
      ws.onclose = (ev) => {
        setStatus('Соединение закрыто' + (ev.reason ? ': ' + ev.reason : ''));
        cleanup();
      };
    };

    function cleanup() {
      startBtn.disabled = false;
      stopBtn.disabled = true;
      if (processor) processor.disconnect();
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (ws && ws.readyState === WebSocket.OPEN) ws.close();
    }

    stopBtn.onclick = () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'stop' }));
      }
      cleanup();
    };
  </script>
</body>
</html>
