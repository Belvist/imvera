# Prometheus scrape config fragment (ROADMAP E9)
scrape_configs:
  - job_name: mossvoice-telephony
    static_configs:
      - targets: ["127.0.0.1:9400"]
    metrics_path: /health
    # Prefer /metrics when exported; until then scrape health for up-ness.

  - job_name: mossvoice-voice
    static_configs:
      - targets: ["127.0.0.1:9600"]
    metrics_path: /health

  - job_name: mossvoice-runtime
    static_configs:
      - targets: ["127.0.0.1:9700"]
    metrics_path: /ready
