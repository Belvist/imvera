# LiveKit Server — self-hosted (ADR-012)
# WebRTC media: udp_port 7882 (mux). SIP RTP 10000-20000 is on livekit-sip, NOT here.
# Docs: https://docs.livekit.io/transport/self-hosting/ports-firewall/

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true

redis:
  address: localhost:6379

keys:
  devkey: secret

logging:
  level: info

webhook:
  api_key: devkey
  urls:
    - http://127.0.0.1:9200/livekit/webhook

room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 20
