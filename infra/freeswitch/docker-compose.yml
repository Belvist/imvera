name: imvera-freeswitch-p0a

services:
  media-bridge:
    build:
      context: ../..
      dockerfile: infra/freeswitch/Dockerfile.bridge
    container_name: imvera-media-bridge
    ports:
      - "127.0.0.1:9210:9210"
    volumes:
      - ../../.run/freeswitch-gate:/app/.run/freeswitch-gate
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9210/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - p0a

  freeswitch:
    build:
      context: .
      dockerfile: Dockerfile
    image: imvera-freeswitch:${IMVERA_FS_IMAGE_TAG:-local}
    platform: linux/amd64
    container_name: imvera-freeswitch
    depends_on:
      media-bridge:
        condition: service_healthy
    environment:
      IMVERA_MEDIA_BRIDGE_WS: ws://media-bridge:9210/stream
      SOUND_TYPES: ""
      SOUND_RATES: ""
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "127.0.0.1:8021:8021/tcp"
      - "16384-16484:16384-16484/udp"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "fs_cli -x 'status' | grep -qi up && fs_cli -x 'module_exists mod_audio_stream' | grep -qx true",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      - p0a

  synthetic-gate:
    profiles: ["gate"]
    build:
      context: ../..
      dockerfile: infra/freeswitch/Dockerfile.synthetic
    depends_on:
      freeswitch:
        condition: service_started
      media-bridge:
        condition: service_healthy
    environment:
      FS_SIP_HOST: freeswitch
      FS_SIP_PORT: "5060"
      FS_NODE_IP: auto
      FS_INBOUND_NUMBER: +15550001000
      FS_GATE_USER: fs-gate-caller
      FS_GATE_PASSWORD: gate
      IMVERA_FS_SYNTH_SIP_PORT: "5077"
    volumes:
      - ../../.run/freeswitch-gate:/app/.run/freeswitch-gate
    networks:
      - p0a

networks:
  p0a:
    driver: bridge
